<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ask A Galaxy of Faces about face painting for your Seattle or Eastside event.">
  <title>Check Availability | A Galaxy of Faces</title>
  <script>
    (() => {
      const theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    .layout { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 0.85fr) minmax(480px, 1.15fr); }
    .intro {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 72px);
      background-image: linear-gradient(var(--cp-overlay), var(--cp-panel)), url("Examples/Final4.jpg");
      background-position: center;
      background-size: cover;
    }
    .brand { color: var(--cp-text); font-family: Georgia, "Times New Roman", serif; font-size: 1.1rem; font-weight: 700; text-decoration: none; }
    .intro-copy { max-width: 560px; }
    .eyebrow { margin: 0 0 12px; color: var(--cp-accent); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 7vw, 6.4rem); line-height: 0.98; letter-spacing: 0; }
    .intro-copy > p:last-child { max-width: 500px; margin: 24px 0 0; color: var(--cp-text); font-size: 1.08rem; }
    .service-area { margin: 0; color: var(--cp-text); font-size: 0.9rem; font-weight: 700; }

    .form-panel { display: grid; place-items: center; padding: clamp(28px, 6vw, 88px); background: var(--cp-bg-elevated); }
    form { width: min(100%, 680px); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: grid; gap: 7px; color: var(--cp-text); font-size: 0.9rem; font-weight: 800; }
    label.full, .actions { grid-column: 1 / -1; }
    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
      outline: none;
      background: var(--cp-surface);
      color: var(--cp-text);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    textarea { min-height: 150px; resize: vertical; }
    .actions { display: flex; align-items: center; gap: 16px; }
    button {
      min-height: 48px;
      padding: 10px 20px;
      border: 1px solid var(--cp-accent);
      border-radius: 0.625rem;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: var(--cp-accent-hover); }
    button:disabled { border-color: var(--cp-border-strong); background: var(--cp-surface-soft); color: var(--cp-text-muted); cursor: not-allowed; }
    .status { margin: 0; color: var(--cp-text-muted); font-size: 0.9rem; }
    .status.success { color: var(--cp-success); }
    .status.error { color: var(--cp-danger); }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .intro { min-height: 68vh; }
    }
    @media (max-width: 540px) {
      form { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="intro">
      <a class="brand" href="index.html">A Galaxy of Faces</a>
      <div class="intro-copy">
        <p class="eyebrow">Bookings & questions</p>
        <h1>Tell me what you’re planning.</h1>
        <p>Share the date, location, and approximate number of guests. Macy will reply with availability and the details you need.</p>
      </div>
      <p class="service-area">Serving Seattle and the Eastside</p>
    </section>

    <section class="form-panel" aria-label="Face painting enquiry form">
      <form id="enquiry-form">
        <input type="hidden" name="_subject" value="New A Galaxy of Faces enquiry">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden>
        <label>
          Your name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Event date
          <input type="date" name="date">
        </label>
        <label>
          Event type
          <select name="event_type">
            <option>Birthday party</option>
            <option>Festival or fair</option>
            <option>School or community event</option>
            <option>Other</option>
          </select>
        </label>
        <label class="full">
          Event location
          <input name="location" autocomplete="address-level2" placeholder="Town, venue, or neighbourhood">
        </label>
        <label class="full">
          Tell me about the event
          <textarea name="message" required placeholder="Approximate number of guests, timing, and anything else that would be helpful..."></textarea>
        </label>
        <div class="actions">
          <button id="submit-button" type="submit">Send enquiry</button>
          <p class="status" id="form-status" role="status">Email delivery is being configured.</p>
        </div>
      </form>
    </section>
  </main>

  <script>
    const formEndpoint = "";
    const form = document.querySelector("#enquiry-form");
    const submitButton = document.querySelector("#submit-button");
    const formStatus = document.querySelector("#form-status");

    if (!formEndpoint) submitButton.disabled = true;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!formEndpoint) return;

      submitButton.disabled = true;
      formStatus.className = "status";
      formStatus.textContent = "Sending...";

      try {
        const response = await fetch(formEndpoint, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error("Submission failed");
        form.reset();
        formStatus.className = "status success";
        formStatus.textContent = "Thanks! Your enquiry has been sent.";
      } catch {
        formStatus.className = "status error";
        formStatus.textContent = "That did not send. Please try again in a moment.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
